[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-framework"
version = "0.1.0"
description = "A small HTTP and WebSocket framework for Python"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["simple_framework*"]
