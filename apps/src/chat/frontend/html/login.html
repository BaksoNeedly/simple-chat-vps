<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class=card>
        <div class="header">
            <h2 class="title">Login</h2>
            <p id="label" class="sub-title label">Please login to your account</p>
        </div>
        <div class="divider">
            <hr>
        </div>
        <form id="card-form" class="card-form"> 
            <div class="field">
                <p>Username</p>
                <input id="username" class="input-1 username" placeholder="Enter your username">
            </div>
            <div class="field">
                <p>Password</p>
                <input id="password" class="input-1 password" type="password" placeholder="Enter your password">
            </div>
            <div class="options">
                <div class="remember-me">
                    <input type="checkbox">
                    <p>Remember me</p>
                </div>  
                <a href="/page/email">Forgot password?</a>
            </div>
            <div class="action-buttons">
                <button class="button-1 login-btn">Login</button>
            </div>                
        </form>
        <div class="or-divider">
            <hr>
            <p>OR</p>
            <hr>
        </div>
        <button class="button-2 sign-up-btn">Don't have an account? Sign up</button>
    </div>
    <p class="form-credit">By Luiz Febrian</p>

    <script type="module" src="../js/auth/login/Login.js"></script>
</body>
</html>
