<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/verified.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="card verified-card">
        <header class="header verified-header">
            <div class="verified-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 12 2 2 4-4"/>
                    <circle cx="12" cy="12" r="9"/>
                </svg>
            </div>
            <h1 class="title">Email verified!</h1>
            <p class="sub-title verified-copy">Your email address has been successfully verified. Your account is now ready to use.</p>
        </header>
        <section class="verified-body">
            <div class="divider"><hr></div>
            <div class="verified-note">
                <span class="verified-dot"></span>
                <p>You can now log in and start chatting.</p>
            </div>
        </section>
        <footer class="verified-footer">
            <a class="button-1" href="/user/return">Return</a>
        </footer>
    </main>
</body>
</html>
