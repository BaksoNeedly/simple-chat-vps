<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reset-password.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="card">
        <header class="header">
            <div class="reset-icon" aria-hidden="true">↻</div>
            <h1 class="title">Set a new password</h1>
            <p class="sub-title reset-copy">Create a strong new password for your account.</p>
        </header>

        <div class="divider"><hr></div>

        <form class="card-form" action="/reset/password" method="post">
            <input id="reset-token" type="hidden" name="token">

            <div class="field">
                <label for="password">New password</label>
                <input
                    id="password"
                    class="input-1"
                    type="password"
                    name="password"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <small class="field-hint">Use at least 8 characters.</small>
            </div>

            <div class="field">
                <label for="confirm-password">Confirm new password</label>
                <input
                    id="confirm-password"
                    class="input-1"
                    type="password"
                    name="confirm_password"
                    placeholder="Re-enter your new password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <p id="reset-message" class="reset-message" role="alert"></p>

            <div class="action-buttons">
                <button class="button-1" type="submit">Update password</button>
            </div>
        </form>

        <a class="reset-return" href="/page/login">Return to login</a>
    </main>
    <script type="module" src="../js/auth/reset-password/ResetPassword.js"></script>
</body>
</html>
