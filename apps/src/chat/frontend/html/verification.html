<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email</title>
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/verification.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="card">
        <header class="header">
            <h2 class="title">Verify your email</h2>
            <p class="sub-title verification-copy">We sent a 6-digit verification code to <strong id="email-label">your email</strong></p>
        </header>
        <section class="verification-body">
            <div class="divider"><hr></div>
            <form id="verification-form" class="card-form">
                <div class="code-fields" aria-label="Verification code">
                <input class="code-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1" autofocus>
                <input class="code-input" maxlength="1" inputmode="numeric" aria-label="Digit 2">
                <input class="code-input" maxlength="1" inputmode="numeric" aria-label="Digit 3">
                <input class="code-input" maxlength="1" inputmode="numeric" aria-label="Digit 4">
                <input class="code-input" maxlength="1" inputmode="numeric" aria-label="Digit 5">
                <input class="code-input" maxlength="1" inputmode="numeric" aria-label="Digit 6">
                </div>
                <p id="verification-message" class="verification-message" role="alert"></p>
                <div class="action-buttons"><button class="button-1" type="submit">Verify email</button></div>
            </form>
        </section>
        <footer class="verification-footer">
            <p class="resend">Didn't receive the code? <button id="resend-button" type="button" disabled>Resend in <span id="timer">60</span>s</button></p>
            <button id="return-button" class="button-2" type="button">Return</button>
        </footer>
    </main>
    <script type="module" src="../js/auth/verification/Verification.js"></script>
</body>
</html>
